version: "3.8"

services:
  database:
    container_name: vacations-compose-database
    image: mysql:8.0
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=1
      - MYSQL_DATABASE=vacations
      - MYSQL_TCP_PORT=3306
    ports:
      - 3307:3306
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s

  backend:
    container_name: vacations-compose-backend
    build: ./backend
    ports:
      - 3003:3003
    environment:
      - NODE_ENV=compose
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./backend:/app
    working_dir: /app
    command: sh -c "npm install && npm run dev"
  frontend:
    container_name: vacations-compose-frontend
    build: ./frontend
    ports:
      - 5173:80
    volumes:
      - ./frontend:/app

volumes:
  db-data:
